name: Monitor convocatoria BdE 2026A11

on:
  schedule:
    - cron: "7,37 * * * *"   # respaldo, aunque sea impuntual
  workflow_dispatch:
  repository_dispatch:
    types: [run-monitor]

permissions:
  contents: write

concurrency:
  group: bde-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_bde.py

      # always(): guarda también el estado de fallo, para no repetir
      # el aviso por Telegram cada 30 minutos.
      - name: Commit estado si cambió
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "bde-monitor-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "Actualiza estado (fecha/PDFs vistos)"
            git pull --rebase --autostash origin main
            git push
          fi
